    <link rel="stylesheet" href="css/style.css">
</head>

<body>

                    <img src="images/logo.svg" alt="Plant Palette"> 
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#main-nav"
                    aria-controls="main-nav"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                   <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="main-nav">
                    <ul class="navbar-nav ms-auto gap-md-2 gap-lg-3 gap-xl-5 text-uppercase">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Menu</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="reservation.html">Reservation</a>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Catering</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="about.html">About</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>
        
    <main id="main-content">

        <!-- Reservation Hero Section -->
        <section class="hero reservation-hero">

            <img
        class="hero-image"
        src="images/reservation-hero-1200.webp"
        srcset="
            images/reservation-hero-640.webp 640w,
            images/reservation-hero-1200.webp 1200w,
            images/reservation-hero-1920.webp 1920w
        "
        sizes="100vw"
        alt="Interior dining area of Plant Palette restaurant"
    >

    <div class="container d-flex justify-content-center justify-content-md-start">
        <div class="hero-content reservation-hero-content">
            <h1>Reserve a Table</h1>

            <p class="mb-0">
                Enjoy a healthy and memorable plant-based dining experience.
            </p>
        </div>
    </div>

</section>

        <!-- Reservation Form Section -->
<section class="reservation-form-section">
    <div class="container">

        <h2 class="text-uppercase text-center mb-5">
            Reservation Form
        </h2>

        <form action="#" method="post">

            <div class="row gx-4 gy-4 g-md-5">

                <!-- Date -->
                <div class="col-12 col-md-6 col-xl-4">
                    <label for="reservation-date" class="form-label">
                        Date
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        id="reservation-date"
                        name="reservation-date"
                    >
                </div>

                <!-- Time -->
                <div class="col-12 col-md-6 col-xl-4">
                    <label for="reservation-time" class="form-label">
                        Time
                    </label>

                    <input
                        type="time"
                        class="form-control"
                        id="reservation-time"
                        name="reservation-time"
                    >
                </div>

                <!-- Guests -->
                <div class="col-12 col-md-6 col-xl-4">
                    <label for="reservation-guests" class="form-label">
                        Number of Guests
                    </label>

                    <select
                        class="form-select"
                        id="reservation-guests"
                        name="reservation-guests"
                    >
                        <option value="" selected>Select guests</option>
                        <option value="1">1 Guest</option>
                        <option value="2">2 Guests</option>
                        <option value="3">3 Guests</option>
                        <option value="4">4 Guests</option>
                        <option value="5">5 Guests</option>
                        <option value="6">6 Guests</option>
                    </select>
                </div>

                <!-- Name -->
                <div class="col-12 col-md-6 col-xl-4">
                    <label for="reservation-name" class="form-label">
                        Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="reservation-name"
                        name="reservation-name"
                    >
                </div>

                <!-- Email -->
                <div class="col-12 col-md-6 col-xl-4">
                    <label for="reservation-email" class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="reservation-email"
                        name="reservation-email"
                    >
                </div>

                <!-- Phone -->
                <div class="col-12 col-md-6 col-xl-4">
                    <label for="reservation-phone" class="form-label">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        class="form-control"
                        id="reservation-phone"
                        name="reservation-phone"
                    >
                </div>

                <!-- Special Requests -->
                <div class="col-12">
                    <label for="reservation-requests" class="form-label">
                        Special Requests (Optional)
                    </label>

                    <textarea
                        class="form-control"
                        id="reservation-requests"
                        name="reservation-requests"
                        rows="4"
                        placeholder="Let us know if you have any special requests or dietary needs."
                    ></textarea>
                </div>

            </div>

            <!-- Buttons -->
            <div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-3 mt-5">

                <button class="btn btn-accent" type="submit">
                    Book a Table
                </button>

                <a class="btn btn-primary" href="#">
                    View Menu
                </a>

            </div>

        </form>

    </div>
</section>





    </main>

    <!-- Footer Section -->
    <footer>

    </footer>

</body>
</html>
